name: Build-NextPad
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Application
        run: |
          # Печатаем список файлов, чтобы убедиться, что мы в нужной папке
          ls -R
          
          # Запускаем сборку, явно указывая файл (если он в корне)
          # Если файл лежит в подпапке, xcodebuild сам его найдет, если мы укажем только схему
          xcodebuild -project "NextPad.xcodeproj" \
                     -scheme "NextPad" \
                     -configuration Release \
                     -derivedDataPath build_output \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: NextPad-App
          path: build_output/Build/Products/Release/*.app
