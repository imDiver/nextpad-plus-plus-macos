name: Build-NextPad
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate and Build
        run: |
          echo "=== Ищем файлы проекта ==="
          # Ищем файл .xcodeproj по всему репозиторию
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          
          if [ -z "$PROJECT_PATH" ]; then
            echo "ОШИБКА: Файл .xcodeproj не найден в репозитории!"
            ls -R
            exit 1
          fi

          echo "Найден проект: $PROJECT_PATH"
          
          # Получаем имя схемы (обычно совпадает с именем файла)
          SCHEME_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          echo "Используем схему: $SCHEME_NAME"

          # Запуск сборки
          xcodebuild -project "$PROJECT_PATH" \
                     -scheme "$SCHEME_NAME" \
                     -configuration Release \
                     -derivedDataPath build_output \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: NextPad-App
          path: build_output/Build/Products/Release/*.app
