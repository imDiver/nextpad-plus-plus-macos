name: Build-NextPad-CMake
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Важно, если проект использует подмодули

      - name: Install Dependencies
        run: |
          brew install cmake

      - name: Configure and Build
        run: |
          mkdir build
          cd build
          # Конфигурация проекта
          cmake .. -DCMAKE_BUILD_TYPE=Release
          # Сборка (используем все ядра процессора для скорости)
          cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: NextPad-Binary
          # CMake обычно создает либо .app в папке build, либо бинарный файл
          path: |
            build/*.app
            build/NextPad
            build/Release/*.app
